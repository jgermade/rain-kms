[package]
name = "rain-kms"
version = "0.2.0"
edition = "2021"
description = "Full-screen digital rain (film style with depth, or rainbow katakana) drawn straight to the display with DRM/KMS (no compositor, no browser)"
repository = "https://github.com/jgermade/rain-kms"

[dependencies]
drm = "0.14"
drm-fourcc = "2.2"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
